name: blitzashNSMB
description: untested

game: New Super Mario Bros. DS
New Super Mario Bros. DS:
  ################
  # Game Options #
  ################
  progression_balancing: normal
  accessibility: full

  #################
  # Goal Settings #
  #################
  goal: defeat_bowser

  ###################
  # Location Checks #
  ###################
  red_coin_checks: true
  one_up_block_checks: false
  blocksanity: false
  secret_exit_checks: true
  toad_house_checks: true
  advanced_location_item_placement: allow_progression

  ###########################
  # Overworld & Progression #
  ###########################
  level_randomization: off
  star_coin_gate_mode: vanilla
  star_coin_tracking: instant
  tower_castle_keys: true
  secret_exit_shortcut_logic: true
  secret_exit_world_unlock_logic: false
  cannon_route_logic: true
  license_mini_mushroom: true
  license_blue_shell: true
  license_mega_mushroom: true
  license_mushroom: true
  license_fire_flower: true
  license_touchscreen_pocket: true

  ################
  # Filler Items #
  ################
  filler_items:
    - coins
    - extra_lives
    - life_insurance
    - powerups
    - starman
    - trap_shield

  #########
  # Traps #
  #########
  trap_percentage: 10
  bonk_trap_can_kill: true
  traps:
    - auto_run
    - bonk
    - camera_drift
    - camera_sway
    - coin_tax
    - coin_thief
    - crazy_pixels
    - ground_clap
    - head_bonk
    - heavy_mario
    - hyper_speed
    - ice_shoes
    - im_stuck
    - no_jump
    - no_sprint
    - no_turnaround
    - powerup_pickpocket
    - reverse_controls
    - retro_filter
    - screen_flip
    - screen_tint
    - slow_speed
    - spotlight
    - sticky_buttons
    - walljump_lock

  ##############
  # Death Link #
  ##############
  death_link: false

  ####################
  # Cosmetic Options #
  ####################
  mario_palette: gold
  luigi_palette: silver
  secondary_screen_background: randomized
  music_randomization: off
