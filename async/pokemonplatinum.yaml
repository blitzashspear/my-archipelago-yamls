  ####################
  pastoria_barriers: false
  early_sunyshore: false
  boat_canalave_pastoria: off
  boat_canalave_snowpoint: off
  boat_pastoria_snowpoint: off
  route_207_barricade: bicycle_slope
  route_210_lower_barricade: none
  route_215_barricade: none

  ############
  # Starters #
  ############
  randomize_starters: true
  require_two_level_evolution_starters: false
  randomize_intro_mon: true

  ###########
  # Pokémon #
  ###########
  randomize_encounters: true
  in_logic_encounters:
    - day
    - emerald
    - feebas_fishing
    - firered
    - good_rod
    - great_marsh_observatory
    - great_marsh_observatory_national_dex
    - leafgreen
    - munchlax_honey_tree
