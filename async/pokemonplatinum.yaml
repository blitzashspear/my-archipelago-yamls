    - odd_keystone
    - old_rod
    - radar
    - regular_honey_tree
    - roamers
    - ruby
    - sapphire
    - super_rod
    - surf
    - swarms
    - trophy_garden
    - feebas_fishing
  dexsanity: none
  evo_items_shop_in_ap_helper: true
  reusable_tms: true
  regional_dex_goal: 60
  start_with_swarms: true
  randomize_roamers: true
  can_reset_legendaries_in_ap_helper: true

  ############
  # Trainers #
  ############
  trainersanity: none
  randomize_trainer_parties: true

  #######
  # HMs #
  #######
  hm_badge_requirement: true
  hm_reader: precollected
  hm_reader_mode: noreq_mon
  tmhm_compatibility: none

  ###################
  # Quality of Life #
  ###################
  game_options:
    battle_scene: off
    battle_style: s
    button_mode: normal
    default_gender: random
    default_player_name: "Blitz"
    default_rival_name: random
    name_strictness: relaxed
    received_items_notification: none
    sound: stereo
    text_frame: 1
    text_speed: fast

  blind_trainers: true
  hm_cut_ins: false
  fps60: true
  buck_pos: false
  hb_speed: 10
  normalize_encounters: true
  instant_text: true
  hold_a_to_advance: true
  always_catch: true
  guaranteed_escape: true
  talk_trainers_without_fight: false
  exp_multiplier: 25
  master_repel: true
  require_fly_items_for_flight: false
  item_notifications_mask:
    - progression
    - useful
  fast_fishing: true

  ###########################
  # Item & Location Options #
  ###########################
  start_inventory_from_pool:
    Master Repel: 1
    Bicycle: 1
    HM02 Fly: 1

  exclude_locations:
