game: Pokemon Platinum
Pokemon Platinum:
  ################
  # Game Options #
  ################
  progression_balancing: disabled
  accessibility: full
  goal: champion
  death_link: false
  death_link_group: ''
  remote_items: all
  cheats_enabled: false

  #################
  # Item Shuffles #
  #################
  overworlds: true
  hiddens: false
  npc_gifts: true
  key_items: true
  hms: true
  badges: true
  rods: true
  bicycle: true
  bag: false
  running_shoes: false
  poketch_apps: false
  cartridges: true
  pokedex: false
  accessories: false
  time_items: true
  randomize_fly_items: all_except_pokemon_league

  ################
  # Logic Tweaks #
  ################
  poketch_route_203: true
  north_sinnoh_fly: false
  visibility_hm_logic: true
  dowsing_machine_logic: true
  marsh_pass: true
  storage_key: true
  s_s_ticket: false
  unown_option: none

  ####################
