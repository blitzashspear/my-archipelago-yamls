name: blitzashBW
description: every copy of pokemon black is personalized
# ASYNC ONLY - TRAINERSANITY (not implemented in apworld yet but i will add it to this yaml) & NON-GHETSIS GOAL

game: Pokemon Black and White
Pokemon Black and White:
  progression_balancing: disabled
  accessibility: full
  version: black
  goal: seven_sages_hunt
  randomize_wild_pokemon: 
    [Randomize, Prevent rare encounters]
  randomize_trainer_pokemon: 
    [Randomize, Similar base stats]
  pokemon_randomization_adjustments: 
    Stats leniency: 150
  shuffle_badges: anything
  shuffle_tm_hm: anything
  dexsanity: 0
  season_control: randomized
  modify_encounter_rates: vanilla
  modify_item_pool: 
    [Ban bad filler, Useful filler]
  modify_logic: 
    [Require Dowsing Machine, Require Flash]
  adjust_levels: # DO NOT DELETE THIS LINE!!!! DEFAULT IS [Wild, Trainer]!!! I FUCKING HATE ADJUST LEVELS!!!!!
    []
  reusable_tms: im_not_a_masochist

  plugin_options:
    qol:
      skip_intro: false
      skip_intro_gender:
        male: 50
        female: 50
      instant_text: true
      faster_story: true
      guaranteed_catch: true
      blind_trainers: true
      tmhm_fully_compatible: true
      remove_pickup_animation: true  # also makes most fanfares skippable
      gym_warps: true
      hm_use: fastest
      guaranteed_fishing: false
      remove_dust_cloud_items: true
      bike_everywhere: true
      remove_surf_bike_music: true

      battle_scene: turned_off
      battle_style: set
      pokemon_entrance_animations: vanilla
      fast_hatch: true
      
    starter_rando: true

  ###########################
  # Item & Location Options #
  ###########################
  exclude_locations:
    [
      # find this random pokemon haha please god no
      "Castelia City - Item from scientist in building in northern street",
      "Driftveil City - Item from man for seeing more than 50 pokémon",
      "Nuvema Town - TM from Professor Juniper for seeing 25 species",
      "Nuvema Town - TM from Professor Juniper for seeing 60 species",
      "Nuvema Town - TM from Professor Juniper for seeing 115 species",
      "Pinwheel Forest Outside - Item from challenge rock",
      "Route 6 - Item from scientist for all Deerling forms",

      # this guy is an asshole
      "Icirrus City - Item from Pokémon Fan Club chairman for gaining 25 levels",
      "Icirrus City - Item from Pokémon Fan Club chairman for gaining 50 levels",
      "Icirrus City - Item from Pokémon Fan Club chairman for gaining 99 levels",

      # fuckass minigames
      "Marvelous Bridge - Patrat shuffle reward",
      "Village Bridge - Item from baker Chris"
    ]
