name: blitzashMCFabric
description: async only

game: Minecraft Fabric
Minecraft Fabric:
  ################
  # Game Options #
  ################
  progression_balancing: disabled
  accessibility: full

  ################
  # Goal Options #
  ################
  goal_condition: advancements_and_items_only
  advancements_required_for_goal: 50
  excluded_locations:
    - Hard
    - Unreasonable

  #####################
  # Itemsanty Options #
  #####################
  itemsanity: true
  items_required_for_goal: 1000
  itemsanity_local_fill: random-range-90-98
  excluded_from_itemsanity:
    - Discs
    - Mob Heads
    - Rare Ores
    - Sherds
    - Trims
  empty_fill_percentage: 75

  ######################
  # Difficulty Options #
  ######################
  required_before_nether:
    - Sprint
  required_before_bosses:
    - Beds
    - Bow
    - Iron Armor
    - Iron Weapons
  required_before_raids:
    - Beds
    - Iron Armor
    - Iron Weapons
  keep_inventory: true
  randomized_abilities:
    - Sprint
    - Swim
  time_saving_options:
    - Copper Oxidation
    - Drowned Items
    - Rabbits Foot
    - Wither Skulls

  #################
  # Traps Options #
  #################
  trap_fill_percentage: 0

  ######################
  # World Link Options #
  ######################
  deathlink_enabled: false
  traplink_enabled: false

  ###############
  # Mod Support #
  ###############
  enabled_mods:
    # https://modded.wiki/w/Fabric_Archipelago_Mod:Mod_Support
    - minecraft
