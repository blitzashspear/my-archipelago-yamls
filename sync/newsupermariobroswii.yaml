name: blitzashNSMBWii
description: sync viable

game: NSMBW
NSMBW:
  ################
  # Game Options #
  ################
  progression_balancing: normal
  accessibility: full

  #############
  # Locations #
  #############
  shortcuts_sanity: enabled
  level_completion: true
  hint_movie_sanity: false
  starcoin_sanity: true
  include_inventory_powerups: 0
  world_comp_priority: false

  #########
  # Items #
  #########
  randomize_powerups: on_except_mushroom
  randomize_abilites: true
  abilites_included:
    - Carry
    - Ground Pound
    - Swim
    - Wall Jump
  randomize_level_elements: true
  level_elements_included:
    - "!-Switch"
    - Door
    - P-Switch
    - Yoshi
  randomize_boss_health: false

  ###################
  # Clear condition #
  ###################
  alternative_goal: bowser
  goal_starcoin_unlock: 100
  goal_world_unlock: 0
  goal_level_unlock: 0

  #########
  # Logic #
  #########
  logic_difficulty: normal
  logic_outside_powerup: false
  starting_world:
    world1: 1
    world2: 1
    world3: 1
    world4: 1
    world5: 1
    world6: 1
    world7: 1
    world8: 0
  starcoin_requirement_world_unlock: 9
  hint_movie_shop_price_logic: free
  world_unlock: separate
  level_unlock: vanilla
  important_early_items: true

  ####################
  # Filler and Traps #
  ####################
  filler_items:
    1-ups: 10
    Coin x01: 10
    Coin x10: 10
    Coin x50: 10
    Fill Inventory: 10
    Low Gravity: 10
    Power-up Grace: 10
    Random Power-up: 10
    Super Speed: 10

  trap_items:
    Goomba trap: 10
    Gravity Trap: 10
    Literature trap: 10
    Lose powerup trap: 10
    Movement lock trap: 10
    Paranoia Trap: 10
    Robbery trap: 10
    Shrink trap: 10
    Slow Trap: 10
    Throw trap: 10

    Death trap: 0
    Reverse Control trap: 0
    Time trap: 0

  trap_chance: 10
  amount_support_received: -1
  modifier_multiplier_percentage: 100
  percentage_filler_forced_local: 20

  ####################
  # Cosmetic Shuffle #
  ####################
  music_shuffle: false
  tile_sheet_shuffle: true

  #################
  # Level Shuffle #
  #################
  level_shuffle: off

  #############
  # DeathLink #
  #############
  death_link: false

  #########
  # Other #
  #########
  starcoin_collect_immediately: true
  save_state_slot: 7
  starcoin_shop_multiplier: 1
  hint_hint_movies: false
  inventory_item_hints_percentage_chance: 0
