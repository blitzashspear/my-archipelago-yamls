name: blitzashYHTWTG
description: https://github.com/blitzashspear/ap-yhtwtg
# SIDE GAME
# APWorld 1

game: You Have to Win the Game
You Have to Win the Game:
  ################
  # Game Options #
  ################
  progression_balancing: disabled
  accessibility: minimal

  ###################
  # Extra Locations #
  ###################
  room_sanity: true
  bell_sanity: false

  #############
  # DeathLink #
  #############
  death_link: true
  death_link_amnesty: 25
  death_link_behavior: 
    checkpoint: 40
    reset: 10

  #########
  # Traps #
  #########
  trap_percentage: 5
  lose_the_game_weight: 50
  stop_jumping_trap_weight: 50
  stop_jumping_trap_length: random
  secret_rooms_trap_weight: 0
  freeze_trap_length: random
  fast_trap_weight: 50
  fast_trap_length: random

  ######################
  # Randomizer Changes #
  ######################
  split_spider_gloves: true
  require_unlock_teleporters: true
  logic_difficulty: hard
  include_extra_roadblocks:
  - Quarry
  - Mineshaft
  - Castle
  - Graveyard
  password_randomization: 
    words: 45
    any: 5

  ##################
  # Filler Options #
  ##################
  local_nothing_percentage: 75
  shuffle_cat_dlc: true

  #######
  # QOL #
  #######
  reset_timer: 25
  auto_solve_password: true
