name: blitzashJigsaw
description: Jigsaw, 100-200 pieces.
# SIDE GAME

game: Jigsaw
Jigsaw:
  ################
  # Game Options #
  ################
  progression_balancing: disabled
  accessibility: full

  ###############################
  # Important options: gameplay #
  ###############################
  number_of_pieces: random-range-100-200
  grid_type_and_rotations: square_no_rotation
  uniform_piece_size: false
  border_type: classic

  ############################
  # Important options: image #
  ############################
  orientation_of_image: landscape
  which_image: random

  ####################################################
  # Optional options: extra pieces, items and checks #
  ####################################################
  percentage_of_extra_pieces: 5
  minimum_number_of_pieces_per_bundle: 4
  add_fillers: true
  percentage_fillers_itempool: 0
  checks_out_of_logic: 0

  #################################
  # Optional options: piece order #
  #################################
  piece_order_type: random
  strictness_piece_order_type: 75
  piece_order: random_order
  strictness_piece_order: 100
  starting_fake_pieces: 0
  number_of_fake_piece_bundles: 0
  number_of_rotate_traps: 0
  number_of_swap_traps: 0
  death_link: 0

  ###########################
  # Optional options: other #
  ###########################
  enable_clues: true
  total_size_of_image: 85
